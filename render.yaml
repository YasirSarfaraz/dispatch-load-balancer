# Render Blueprint (infrastructure as code): https://render.com/docs/blueprint-spec
# One PostgreSQL database and one Docker web service in the same region. The service receives the database
# host and credentials from Render itself (fromDatabase), so no secret is stored in this repository.
databases:
  - name: dispatch-db
    plan: free
    region: singapore
    databaseName: dispatch
    user: dispatch
    postgresMajorVersion: "16"

services:
  - type: web
    name: dispatch-load-balancer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    # Released deliberately (Manual Deploy) after ./mvnw verify has passed; see docs/OPERATIONS.md.
    autoDeploy: false
    envVars:
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
      - key: DB_HOST
        fromDatabase:
          name: dispatch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dispatch-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dispatch-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: dispatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dispatch-db
          property: password
