# Production profile: PostgreSQL. Activated with SPRING_PROFILES_ACTIVE=prod.
# On Render, render.yaml injects DB_HOST, DB_PORT, DB_NAME, DB_USERNAME and DB_PASSWORD from the
# managed database, so no credentials live in the repository. DB_URL, if set, overrides the host fields.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?reWriteBatchedInserts=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Small pool: the free instance has one shared CPU and the free database a low connection limit.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000   # ms (Hikari properties are plain milliseconds)
      max-lifetime: 900000        # ms, 15 minutes
  jpa:
    hibernate:
      ddl-auto: validate
